[project]
name = "astro-mcp"
version = "1.0.0"
description = "Precision astrological physics engine exposed via Model Context Protocol (MCP)."
readme = "README.md"
authors = [{ name = "Scott Carroll", email = "scott@rippleroot.studios" }]
requires-python = ">=3.10, <3.12"
dependencies = [
    "flatlib",
    "mcp>=0.1.0",
    "pydantic",
    "structlog>=24.0.0"
]

# This tells uv to install these tools
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "python-semantic-release>=9.0.0",
]

[project.scripts]
astro-mcp = "astro_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "python-semantic-release>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=astro_mcp --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "conventional"
build_command = "pip install build && python -m build"
upload_to_pypi = false
upload_to_release = true
tag_format = "v{version}"
